name: Publish Isla-to-Alps image

on:
  push:
    tags:
      - "isla-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-isla-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish all-in-one image
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Isla release source
        shell: bash
        run: |
          git fetch --no-tags origin isla/printed-ticket-number
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor \
            "$release_commit" \
            origin/isla/printed-ticket-number; then
            echo "The release tag must reference the Isla production branch." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/datenwerft/hi-events
          tags: |
            type=ref,event=tag
            type=sha,prefix=isla-sha-
          labels: |
            org.opencontainers.image.title=Hi.Events Isla-to-Alps
            org.opencontainers.image.description=Customized all-in-one Hi.Events image for Isla to Alps

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.all-in-one
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=isla-all-in-one
          cache-to: type=gha,mode=max,scope=isla-all-in-one
          provenance: mode=max
          sbom: true

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "## Isla-to-Alps image"
            echo
            echo '```text'
            echo "${{ steps.metadata.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
